name: Build APK

on:
  push: 
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name:  Configurer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci

      - name: Build web (Vite)
        run: npm run build

      - name: Générer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Ajouter les permissions (caméra + localisation)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$MANIFEST"
          cat "$MANIFEST"

      - name: Compiler l'APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ManualCam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
